<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cronometro</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#0f172a;color:#f8fafc;font-family:system-ui,sans-serif}
  #app{display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
  #time{flex:0 0 36%;display:flex;align-items:center;justify-content:center;font-size:17vw;font-weight:700;font-variant-numeric:tabular-nums}
  .row{display:flex;gap:12px;margin-bottom:12px}
  button{flex:1;border:0;border-radius:18px;font-size:6vw;font-weight:700;padding:5vh 0;color:#fff}
  #start{background:#16a34a}#start.run{background:#d97706}
  #save{background:#2563eb}#reset{background:#475569}
  button:disabled{opacity:.35}
  #list{flex:1;overflow-y:auto;margin-top:4px}
  .item{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid #1e293b;font-size:4.2vw}
  .item b{font-variant-numeric:tabular-nums}
  .item span.x{color:#f87171;padding:0 8px;font-size:5vw}
  #tools{display:flex;justify-content:space-between;font-size:3.8vw;color:#94a3b8;padding:6px 4px}
  #tools a{color:#60a5fa}
</style>
</head>
<body>
<div id="app">
  <div id="time">00:00:00</div>
  <div class="row"><button id="start">Avvia</button></div>
  <div class="row"><button id="save" disabled>Salva</button><button id="reset" disabled>Azzera</button></div>
  <div id="tools"><span id="count"></span><a id="copy">Copia CSV</a></div>
  <div id="list"></div>
</div>
<script>
const $=id=>document.getElementById(id);
let acc=0,startTs=null,tick=null;
const KEY='cronometro_salvati';
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return []}};
const store=a=>{try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}};
const elapsed=()=>acc+(startTs?Date.now()-startTs:0);
const fmt=ms=>{const s=Math.floor(ms/1000);return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(n=>String(n).padStart(2,'0')).join(':')};
function render(){
  $('time').textContent=fmt(elapsed());
  const running=!!startTs,has=elapsed()>0;
  $('start').textContent=running?'Pausa':(has?'Riprendi':'Avvia');
  $('start').classList.toggle('run',running);
  $('save').disabled=!has;$('reset').disabled=!has;
}
$('start').onclick=()=>{
  if(startTs){acc+=Date.now()-startTs;startTs=null;clearInterval(tick);}
  else{startTs=Date.now();tick=setInterval(render,200);}
  render();
};
$('reset').onclick=()=>{startTs=null;acc=0;clearInterval(tick);render();};
$('save').onclick=()=>{
  const ms=elapsed();
  const a=load();a.unshift({d:new Date().toISOString(),ms});store(a);
  startTs=null;acc=0;clearInterval(tick);render();list();
};
function list(){
  const a=load();$('count').textContent=a.length+' salvati';
  $('list').innerHTML='';
  a.forEach((r,i)=>{
    const el=document.createElement('div');el.className='item';
    const dt=new Date(r.d).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
    el.innerHTML='<span>'+dt+'</span><b>'+fmt(r.ms)+'</b><span class="x">✕</span>';
    el.querySelector('.x').onclick=()=>{if(confirm('Eliminare?')){const b=load();b.splice(i,1);store(b);list();}};
    $('list').appendChild(el);
  });
}
$('copy').onclick=async()=>{
  const csv='data;durata\n'+load().map(r=>new Date(r.d).toLocaleString('it-IT')+';'+fmt(r.ms)).join('\n');
  try{await navigator.clipboard.writeText(csv);alert('CSV copiato negli appunti');}
  catch(e){prompt('Copia il CSV:',csv);}
};
document.addEventListener('visibilitychange',render);
render();list();
</script>
</body>
</html>
